# Generated by matugen from ~/.config/matugen/templates/dunst-colors.conf --
# do not edit by hand. dunst reads dunstrc.d/*.conf after dunstrc.
[global]
    frame_color = "{{colors.primary.default.hex}}"
    highlight = "{{colors.primary.default.hex}}"

[urgency_low]
    background = "{{colors.surface.default.hex}}"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.outline_variant.default.hex}}"

[urgency_normal]
    background = "{{colors.surface_container.default.hex}}"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.primary.default.hex}}"

[urgency_critical]
    background = "{{colors.surface_container.default.hex}}"
    foreground = "{{colors.error.default.hex}}"
    frame_color = "{{colors.error.default.hex}}"
