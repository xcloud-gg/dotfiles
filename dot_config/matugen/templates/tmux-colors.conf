# Auto-generated by matugen -- do not edit by hand, edit
# dotfiles/matugen/.config/matugen/templates/tmux-colors.conf instead.
#
# @thm_* user options (not literal colors baked into status-style etc.) so
# .tmux.conf's own format strings stay static and only the values here
# change on a wallpaper switch -- same pattern as InioX/matugen-themes'
# tmux template.
#
# @thm_primary/@thm_on_primary are the fixed xcloud green (matugen custom
# colour `xcloud`, ~/.config/matugen/config.toml), as on the Arch rice
# (#00ff00 on #015000); the rest follows the wallpaper.

set -gq @thm_bg              "{{colors.background.default.hex}}"
set -gq @thm_fg              "{{colors.on_background.default.hex}}"
set -gq @thm_primary         "{{colors.xcloud_source.default.hex}}"
set -gq @thm_on_primary      "{{colors.on_xcloud_container.default.hex}}"
set -gq @thm_surface         "{{colors.surface_container.default.hex}}"
set -gq @thm_surface_variant "{{colors.surface_container_high.default.hex}}"
set -gq @thm_outline         "{{colors.outline_variant.default.hex}}"
