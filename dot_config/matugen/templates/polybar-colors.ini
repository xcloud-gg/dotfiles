; Generated by matugen from ~/.config/matugen/templates/polybar-colors.ini --
; do not edit by hand. Included by ~/.config/polybar/config.ini.
[colors]
background = #d8{{colors.surface.default.hex_stripped}}
background-alt = {{colors.surface_container.default.hex}}
foreground = {{colors.on_surface.default.hex}}
; accent = the fixed xcloud green (matugen custom colour `xcloud`)
accent = {{colors.xcloud_source.default.hex}}
; urgent workspace background: the error role (container tone, so the light label text stays readable)
urgent = {{colors.error_container.default.hex}}
error = {{colors.error.default.hex}}
border = {{colors.outline_variant.default.hex}}
