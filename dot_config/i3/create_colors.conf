# Generated by matugen from ~/.config/matugen/templates/i3-colors.conf --
# do not edit by hand. Included by ~/.config/i3/config. The client.* lines
# live here too: i3 variables set in an included file don't reach the parent.
set $background       #101418
set $surface          #101418
set $on_surface       #e0e2e8
set $error            #ffb4ab
set $accent           #00ff00
set $on_accent        #015000
set $accent_inactive  #008f00
set $on_error         #690005

# Hyprland (hyprland-gui.lua): active border rgba(00ff00ff), inactive
# 0x8e00ff00 -- the fixed xcloud green (matugen custom colour `xcloud`), not
# the wallpaper palette. i3 border colours take no alpha, so inactive is the
# green at 28% lightness (#008f00 ~ #00ff00 at 0x8e alpha over black). With
# `default_border pixel` only the border columns show, except in tabbed/stacked
# layouts, whose title bars keep the palette's surface colours.
# class                 border            bg         text         indicator         child_border
client.focused           $accent           $accent    $on_accent   $accent           $accent
client.focused_inactive  $accent_inactive  $surface   $on_surface  $accent_inactive  $accent_inactive
client.unfocused         $accent_inactive  $surface   $on_surface  $accent_inactive  $accent_inactive
client.urgent            $error            $error     $on_error    $error            $error
client.placeholder       $accent_inactive  $surface   $on_surface  $accent_inactive  $accent_inactive
client.background        $background
