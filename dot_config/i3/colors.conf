# Generated by matugen from ~/.config/matugen/templates/i3-colors.conf --
# do not edit by hand. Included by ~/.config/i3/config. The client.* lines
# live here too: i3 variables set in an included file don't reach the parent.
set $background       #101418
set $surface          #101418
set $on_surface       #e0e2e8
set $primary          #9cd0ff
set $on_primary       #003351
set $error            #ffb4ab
set $on_error         #690005

# Hyprland: active border = primary->on_primary gradient, inactive = on_primary
# (i3 has no gradients, so focused is plain primary). With `default_border
# pixel` only the border columns show, except in tabbed/stacked layouts.
# class                 border       bg        text         indicator    child_border
client.focused           $primary     $primary  $on_primary  $primary     $primary
client.focused_inactive  $on_primary  $surface  $on_surface  $on_primary  $on_primary
client.unfocused         $on_primary  $surface  $on_surface  $on_primary  $on_primary
client.urgent            $error       $error    $on_error    $error       $error
client.placeholder       $on_primary  $surface  $on_surface  $on_primary  $on_primary
client.background        $background
