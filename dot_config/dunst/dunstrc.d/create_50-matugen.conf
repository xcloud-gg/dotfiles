# Generated by matugen from ~/.config/matugen/templates/dunst-colors.conf --
# do not edit by hand. dunst reads dunstrc.d/*.conf after dunstrc.
# Accent (frames, progress bar) = the fixed xcloud green (matugen custom
# colour `xcloud`); the rest follows the wallpaper.
[global]
    frame_color = "#00ff00"
    highlight = "#00ff00"

[urgency_low]
    background = "#101418"
    foreground = "#e0e2e8"
    frame_color = "#404850"

[urgency_normal]
    background = "#1c2024"
    foreground = "#e0e2e8"
    frame_color = "#00ff00"

[urgency_critical]
    background = "#1c2024"
    foreground = "#ffb4ab"
    frame_color = "#ffb4ab"
