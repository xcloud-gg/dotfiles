# Auto-generated by matugen -- do not edit by hand, edit
# dotfiles/matugen/.config/matugen/templates/tmux-colors.conf instead.
#
# @thm_* user options (not literal colors baked into status-style etc.) so
# .tmux.conf's own format strings stay static and only the values here
# change on a wallpaper switch -- same pattern as InioX/matugen-themes'
# tmux template.
#
# @thm_primary/@thm_on_primary deliberately use the primary_container/
# on_primary_container roles, not plain primary/on_primary: this repo seeds
# matugen from the literal xcloud brand green (`matugen color hex '#00FF00'`
# in xcloud-wallpaper's run_matugen(), not a wallpaper-derived color), and
# Material You's dark-scheme rules lighten the plain "primary" role toward
# near-white for text-contrast reasons -- primary_container is the role that
# actually stays close to the seed hue. Using plain primary here produced a
# washed-out pale-cream accent instead of a visible green (confirmed: this
# machine's live primary was #eaffde vs. primary_container's #00ff00).

set -gq @thm_bg              "#0c1609"
set -gq @thm_fg              "#d9e7d0"
set -gq @thm_primary         "#00ff00"
set -gq @thm_on_primary      "#015000"
set -gq @thm_surface         "#182214"
set -gq @thm_surface_variant "#222d1e"
set -gq @thm_outline         "#3b4b35"
