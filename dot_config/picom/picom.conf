# Compositor for the i3 rice -- port of the Arch/Hyprland rice's
# hypr/conf/decorations/default.lua (blur, shadow, inactive opacity),
# hyprland-gui.lua (rounding 5) and hypr/conf/animations/default.lua.
# picom 12.5 (Debian trixie). Started by ~/.config/i3/scripts/picom.sh, which
# picks the backend: glx on real hardware, xrender in VMs (no blur there).
#
# Everything per-window is in `rules` (picom's window rules). With `rules`
# set, the legacy *-exclude / opacity-rule / wintypes / inactive-opacity
# options are ignored, so none of them are used here.

backend = "glx";
vsync = true;

# ---- shadow ----------------------------------------------------------------
# Hyprland: shadow range 32, render_power 2, color rgba(00000050), no offset.
# picom's shadow is (window + 2*radius) big and placed at the offsets, so
# offset = -radius centers it under the window like Hyprland's.
shadow = true;
shadow-radius = 32;
shadow-opacity = 0.31;   # 0x50 / 0xff
shadow-offset-x = -32;
shadow-offset-y = -32;
shadow-color = "#000000";

# ---- blur ------------------------------------------------------------------
# Hyprland: blur size 4, passes 4 (dual kawase: 4 down/up passes, offset 4).
# picom's dual_kawase strength 11 is exactly 4 iterations at offset 4.0
# (src/backend/backend_common.c in picom 12.5). Hyprland's noise, contrast,
# vibrancy and xray have no picom equivalent. Only the glx backend blurs.
blur: {
  method = "dual_kawase";
  strength = 11;
}

# ---- rounding --------------------------------------------------------------
# Hyprland: rounding 5 (hyprland-gui.lua overrides default.lua's 10).
corner-radius = 5;

# ---- animations ------------------------------------------------------------
# Hyprland animation speed is in 100 ms units. Curves are Hyprland's beziers:
#   md3_decel  = 0.05, 0.7, 0.1, 1      md3_accel = 0.3, 0, 0.8, 0.15
# windowsIn   speed 3, md3_decel, popin 60%  -> open:  scale 0.6 -> 1, 0.3 s
# windowsOut  speed 3, md3_accel, popin 60%  -> close: scale 1 -> 0.6, 0.3 s
# fade        speed 3, md3_decel             -> the opacity part of all of them
# workspaces  speed 7, menu_decel, slide     -> not portable: on i3 a workspace
#   switch unmaps/maps windows (picom's hide/show triggers) with no direction,
#   so a slide would go the wrong way half the time; show/hide fade instead.
# Output variables left undefined in close/hide default to 0 opacity, so each
# script sets opacity explicitly (picom(1), ANIMATIONS).
animations = ({
  triggers = [ "open" ];
  opacity = {
    curve = "cubic-bezier(0.05, 0.7, 0.1, 1)";
    duration = 0.3;
    start = "window-raw-opacity-before";
    end = "window-raw-opacity";
  };
  blur-opacity = "opacity";
  shadow-opacity = "opacity";
  scale-x = {
    curve = "cubic-bezier(0.05, 0.7, 0.1, 1)";
    duration = 0.3;
    start = 0.6;
    end = 1;
  };
  scale-y = "scale-x";
  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
  offset-x = "(1 - scale-x) / 2 * window-width";
  offset-y = "(1 - scale-y) / 2 * window-height";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
}, {
  triggers = [ "close" ];
  opacity = {
    curve = "cubic-bezier(0.05, 0.7, 0.1, 1)";
    duration = 0.3;
    start = "window-raw-opacity-before";
    end = "window-raw-opacity";
  };
  blur-opacity = "opacity";
  shadow-opacity = "opacity";
  scale-x = {
    curve = "cubic-bezier(0.3, 0, 0.8, 0.15)";
    duration = 0.3;
    start = 1;
    end = 0.6;
  };
  scale-y = "scale-x";
  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
  offset-x = "(1 - scale-x) / 2 * window-width";
  offset-y = "(1 - scale-y) / 2 * window-height";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
}, {
  triggers = [ "show", "hide", "increase-opacity", "decrease-opacity" ];
  opacity = {
    curve = "cubic-bezier(0.05, 0.7, 0.1, 1)";
    duration = 0.3;
    start = "window-raw-opacity-before";
    end = "window-raw-opacity";
  };
  blur-opacity = "opacity";
  shadow-opacity = "opacity";
})

# ---- per-window rules (later rules override earlier ones) ------------------
rules = ({
  # Hyprland decoration: blur behind every (semi-)transparent window.
  blur-background = true;
}, {
  # Hyprland: active_opacity 1.0, inactive_opacity 0.9 -- windows only, not
  # the bar, overlays, menus or notifications. The opacity multiplies with
  # the window's own alpha (kitty's background_opacity), as on Hyprland.
  match = "(window_type = 'normal' || window_type = 'dialog' || window_type = 'utility') && "
          "!focused && !group_focused && !override_redirect && !wmwin && !fullscreen";
  opacity = 0.9;
}, {
  # Hyprland blur.popups = false: menus are not blurred.
  match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
          "window_type = 'menu' || window_type = 'combo'";
  blur-background = false;
}, {
  match = "window_type = 'tooltip' || window_type = 'dnd' || "
          "class_g = 'i3-frame' || class_g = 'slop' || _GTK_FRAME_EXTENTS@";
  shadow = false;
  blur-background = false;
}, {
  match = "fullscreen || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # The Quickshell shell's windows are mostly transparent and draw their own
  # rounded shapes, shadows and open/close animations, so picom's rectangle
  # shadow/blur/rounding and its animations are kept off them: the bar (a
  # dock), the OSD / power-profile popup (tooltip windows) and the overlays
  # titled xcloud-power/-calendar/-launcher/-sidebar (Quickshell sets no
  # WM_CLASS, so they are matched by title). The empty animation script (no
  # timing function) ends instantly, i.e. no animation.
  match = "window_type = 'dock' || window_type = 'tooltip' || "
          "name ~= '^xcloud-(power|calendar|launcher|sidebar)$'";
  shadow = false;
  blur-background = false;
  corner-radius = 0;
  animations = ({
    triggers = [ "open", "close", "show", "hide", "increase-opacity", "decrease-opacity" ];
  });
})
