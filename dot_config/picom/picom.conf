# Compositor for the i3 rice — approximates the Hyprland side's blur/opacity look
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-color = "#000000";
# The Quickshell shell's windows are mostly transparent and draw their own
# rounded shapes and shadows, so picom's rectangle-shaped shadow/blur/rounding
# is kept off them: the bar (a dock), the OSD / power-profile popup (tooltip
# windows) and the overlays titled xcloud-power/-calendar/-launcher/-sidebar
# (Quickshell sets no WM_CLASS, so they are matched by title).
shadow-exclude = [
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c",
    "name ~= '^xcloud-(power|calendar|launcher|sidebar)$'"
];

blur: {
  method = "dual_kawase";
  strength = 6;
}
blur-background-exclude = [
    "class_g = 'slop'",
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "name ~= '^xcloud-(power|calendar|launcher|sidebar)$'"
];

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "name ~= '^xcloud-(power|calendar|launcher|sidebar)$'"
];
round-borders = 2;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# matches kitty's background_opacity 0.7
opacity-rule = [
    "70:class_g = 'kitty'",
    "90:class_g = 'Rofi'"
];

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.9; }
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; }
  dropdown_menu = { opacity = 0.95; }
}
