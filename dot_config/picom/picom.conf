# Compositor for the i3 rice — approximates the Hyprland side's blur/opacity look
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-color = "#000000";
shadow-exclude = [
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

blur: {
  method = "dual_kawase";
  strength = 6;
}
blur-background-exclude = [
    "class_g = 'slop'"
];

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
round-borders = 2;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# matches kitty's background_opacity 0.7
opacity-rule = [
    "70:class_g = 'kitty'",
    "90:class_g = 'Rofi'"
];

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.9; }
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; }
  dropdown_menu = { opacity = 0.95; }
}
