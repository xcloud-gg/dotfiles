; Polybar for the i3 rice — stands in for waybar on the Hyprland side
; Same palette: background #0c1609, foreground #d9e7d0, accent #68e054

[colors]
background = #d80c1609
background-alt = #18182214
foreground = #d9e7d0
accent = #68e054
urgent = #00ff00
error = #ffb4ab
border = #3b4b35

[bar/main]
width = 100%
height = 32px
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "Fira Sans Semibold:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"

modules-left = i3
modules-center = date
modules-right = pulseaudio network cpu memory battery tray

tray-position = right
tray-padding = 4

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.accent}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %A, %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted =
ramp-volume-0 =
ramp-volume-1 =
ramp-volume-2 =

[module/network]
type = internal/network
interface-type = wired
format-connected = <label-connected>
label-connected =  %local_ip%
format-disconnected = <label-disconnected>
label-disconnected =  offline
label-disconnected-foreground = ${colors.error}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label =  %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
label =  %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging =  %percentage%%
label-discharging =  %percentage%%
format-full =
label-full =

[settings]
screenchange-reload = true
pseudo-transparency = true
