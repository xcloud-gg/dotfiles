; Night light -- the Hyprland rice's hyprsunset setup: 5000 K at gamma 0.8
; (hyprsunset.conf) during the night hours of xcloud-hyprsunset-scheduler
; (day from 07:00, night from 19:00). Started by the i3 config; SUPER+SHIFT+H
; (~/.config/i3/scripts/nightlight.sh) toggles it.
[general]
temp-day=6500
temp-night=5000
brightness-day=1.0
brightness-night=0.8
dawn-time=07:00
dusk-time=19:00
fade=1
adjustment-method=randr
