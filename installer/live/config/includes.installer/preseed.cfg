# Debian 13 (trixie) preseed for the xCloud LIVE ISO (live-build, --debian-installer live).
# Derived from /opt/claude/baldr/installer/preseed.cfg (netinst version) — the
# partman recipe and its hard-won fixes are unchanged. Differences:
#  - baked into the d-i initrd (config/includes.installer/), auto-loaded; no Ventoy plugin
#  - live-installer copies the squashfs: no tasksel/pkgsel, no network package install
#  - accounts (xcloud 1000, marius 1001) are already in the image: no user-setup
#  - target disk is not hardcoded: xcloud-pick-disk.sh (partman/early_command)
#    fills @DISK@ from `partman-auto/disk=` on the kernel cmdline (the thor boot
#    entry) or the single non-removable disk present
#  - late.sh is read from the initrd, not fetched from GitHub

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select no

### Network
d-i netcfg/choose_interface select auto
d-i hw-detect/load_firmware boolean true
# Hostname intentionally left interactive (not preseeded) — this stick may be
# used to install more than one machine; typing it at install time avoids
# every target ending up named "thor".

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# REQUIRED for pkgsel/include below: firmware-linux and firmware-misc-nonfree
# both live in the non-free-firmware archive area, not main. Without this,
# apt-setup only configures main (hw-detect/load_firmware's own auto-add of
# the component only fires if the installer's own hardware detection needs
# firmware *during the install itself* — not reliable enough to depend on),
# and pkgsel fails to locate those two packages: exactly a "software install
# stage" failure, and the actual bug being fixed here.
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Oslo
d-i clock-setup/ntp boolean true

### Partitioning — guided, entire disk, LUKS2 -> LVM -> single LV -> Btrfs.
### LVM is required here: Debian's automated/preseeded encrypted-disk path only
### works through partman-auto-lvm (a direct crypto+btrfs recipe with no LVM
### isn't reliably preseedable) — same reasoning as loki's own LUKS2->btrfs
### setup, just with an LVM layer in between for preseed's sake. Single LV, no
### separate swap LV: zram handles swap instead (matches the aiOS portable-kit
### convention). Actual Btrfs subvolume layout (@ @home @log @docker @srv) is
### created in late_command/late.sh after the base install, since partman-btrfs
### doesn't support custom subvolume recipes directly (confirmed: this is the
### standard, if slightly fiddly, way people automate it).
d-i partman-auto/method string crypto
# The OS disk must be explicit: with `partman-auto/disk` unset and more than one disk
# present, partman-auto-lvm's PV scan doesn't reliably resolve which disk the
# volume group's physical volume is actually on, producing the exact
# "no physical volume defined in volume group" error hit on real hardware
# (confirmed against partman's own recipe doc: "the device *must* be listed
# in partman-auto/disk" for LVM-specific recipe options) — not a stale-
# metadata issue (that has its own distinct error, partman-auto-lvm/vg_exists)
# and not a recipe-syntax issue (the two-block PV/LV pattern below was
# already correct).
# partman-auto/disk: set by xcloud-pick-disk.sh (partman/early_command)
d-i partman/early_command string sh /xcloud-pick-disk.sh
d-i partman-auto/choose_recipe select xcloud-crypto-btrfs
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/expert_recipe string				\
      xcloud-crypto-btrfs ::					\
              538 538 538 free					\
                      $iflabel{ gpt } $reusemethod{ }		\
                      method{ efi } format{ }			\
              .							\
              1024 1024 1024 ext4				\
                      $primary{ } $bootable{ }			\
                      method{ format } format{ }		\
                      use_filesystem{ } filesystem{ ext4 }	\
                      mountpoint{ /boot }			\
              .							\
              8000 100000 -1 ext4				\
                      $defaultignore{ }				\
                      method{ lvm } device{ @DISK@ }	\
                      vg_name{ xcloud_vg }			\
              .							\
              8000 100000 -1 btrfs				\
                      $lvmok{ } lv_name{ root } in_vg{ xcloud_vg } \
                      method{ format } format{ }		\
                      use_filesystem{ } filesystem{ btrfs }	\
                      mountpoint{ / }				\
              .
# ^ The two blocks above are NOT the same partition: the first
# (method{ lvm } vg_name{ xcloud_vg }) is the raw partition that becomes the
# encrypted LVM physical volume -- its `ext4` tag is a grammar formality and
# is never actually used, since method{ lvm } means "this space becomes a PV,"
# not "format this." The second (lv_name{ root } in_vg{ xcloud_vg }) is the
# logical volume created *inside* that group. The first pass at this recipe
# only had the second block, referencing a volume group that nothing ever
# created -- exactly the "no physical volume defined in volume group" error
# hit on real hardware. Verified this exact two-block pattern (PV-creating
# partition, then a separate lv_name{}/in_vg{} block) against a working
# preseed example before fixing it a second time.
d-i partman-auto-lvm/new_vg_name string xcloud_vg
# partman-partitioning/confirm_write_new_label, partman/choose_partition,
# partman/confirm, and partman/confirm_nooverwrite are DELIBERATELY left
# unset — this is the one real checkpoint before an irreversible full-disk
# wipe, on a general-purpose installer meant to run on more than one machine
# with an unknown disk layout each time. Preseeding any of these means d-i
# treats the question as already answered rather than actually asking (an
# earlier revision set them to `false`, intending "stay interactive" — that
# doesn't leave it interactive, it preseeds the answer "no", which just
# bounces d-i back into its own manual partitioning menu instead of showing a
# clean confirmation). Leaving them unset gives the normal end-of-partitioning
# summary screen with "Finish partitioning and write changes to disk"
# already selectable — one screen, one confirmation, not a manual walkthrough.
# Everything else above (the recipe, LVM, encryption) still applies
# automatically; this is the only manual step in the entire install.

### Accounts — none created here. xcloud (1000) and marius (1001) are already
### in the live image (hook 0100-xcloud-users); passwords are set on first boot
### by xcloud-firstboot, and aios by bootstrap-host.sh (agent kit) for aios-* roles.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean false
d-i user-setup/allow-password-weak boolean false

### Packages — none selected here: live-installer copies the image's squashfs
### (package list: config/package-lists/xcloud.list.chroot).
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### late_command — late.sh ships in this initrd next to this file (Btrfs
### subvolume reshape, crypttab flags, optional games/data disk).
d-i preseed/late_command string sh /late.sh
