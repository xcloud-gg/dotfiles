menuentry 'Install - thor (OS on the 1TB WDS100T1X0E, WIPES the 2TB WDS200T1X0E as games/data)' --hotkey=t {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ xcloud.osdisk=WDS100T1X0E xcloud.datadisk=WDS200T1X0E --- quiet
	initrd	@INITRD_DI@
}
menuentry 'Install - single internal disk (auto-detected)' --hotkey=i {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
