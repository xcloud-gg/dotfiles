menuentry 'Install - thor (OS on nvme1n1, WIPES nvme0n1 as games/data)' --hotkey=t {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ partman-auto/disk=/dev/nvme1n1 xcloud.datadisk=/dev/nvme0n1 --- quiet
	initrd	@INITRD_DI@
}
menuentry 'Install - single internal disk (auto-detected)' --hotkey=i {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
