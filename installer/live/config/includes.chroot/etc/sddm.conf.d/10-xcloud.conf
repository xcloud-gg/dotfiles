# xCloud: SDDM as on loki (/etc/sddm.conf there), plus cursor, X11 and
# Numlock=none (Arch's default: the DM leaves NumLock alone, i.e. off).
# /etc/sddm.conf itself is left to live-config (0085-sddm writes the live
# session's [Autologin] there at boot, in the live overlay only), so the
# installed system has no autologin: xcloud-firstboot runs before the DM.
[General]
DisplayServer=x11
Numlock=none
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/ml4w/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=ml4w
CursorTheme=Bibata-Modern-Ice
CursorSize=24
