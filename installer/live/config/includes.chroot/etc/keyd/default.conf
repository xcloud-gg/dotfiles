[ids]
*

[main]
# Tap = the tmux prefix: Alt+' is Alt+æ on the Norwegian layout (the key
# right of Ø); dot_tmux.conf binds both M-' and M-æ as prefix, so
# Caps(tap) -> Enter opens a new pane. Hold = the [capslock] layer below.
capslock = overload(capslock, A-apostrophe)

[capslock]
# CapsLock(hold)+A -> Alt+' -- the tmux prefix (dotfiles/tmux/.tmux.conf),
# reachable this way as an alternative to the plain Alt+' keypress.
a = A-apostrophe
# CapsLock(hold)+V/C/X -> Alt+Shift+V / Alt+Shift+C / Alt+Shift+X --
# global, unprefixed tmux clipboard paste/copy/push
# (dotfiles/tmux/.tmux.conf's M-V/M-C/M-X binds), reachable without ever
# touching the tmux prefix. C copies to tmux's own buffer only; X is the
# separate, explicit "push tmux's buffer to the system clipboard" action.
v = A-S-v
c = A-S-c
x = A-S-x
# Everything else passes through unchanged until more hotkeys are defined.
# Add bindings here, e.g.:
#   t = C-S-t
# For CapsLock + a real modifier (e.g. CapsLock+Ctrl+<key>) to behave
# differently from CapsLock+<key> alone, add composite layers, e.g.:
#   [capslock+control]
#   k = A-f4
