# ~/.tmux.conf — mirrors the desktop's SUPER keybind scheme (i3 here, Hyprland
# on the Arch machine -- ~/.config/i3/config mirrors hypr's keybindings/default.lua)
# wherever tmux has a comparable concept. tmux's "prefix" stands in for SUPER,
# since terminals can't reliably capture Super-key combos.
#
# The mapping model (same one the i3 config uses for its own containers):
#   i3/Hyprland window     <-> tmux pane
#   i3/Hyprland workspace  <-> tmux window
#   SUPER+<key>            <-> prefix + Shift+<key> for letters (F, J, G, Q ...),
#                              since lowercase prefix keys are tmux's own
#                              reflex defaults (d, c, n, p, z ...) and stay put;
#                              arrows, digits, Return, Tab and Ctrl+<key> map 1:1.
# Keyboard layout is Norwegian ("no", /etc/default/keyboard) -- the Shift+digit
# binds below use the symbols that layout actually sends.

# -- Prefix: Alt+' -- single comfortable keypress, also reachable via a
# -- CapsLock(hold)+A keyd chord (/etc/keyd/default.conf's [capslock]
# -- layer). Ctrl-a kept as the long-standing fallback for muscle memory. --
unbind C-b
set -g prefix M-\'
bind M-\' send-prefix
set -g prefix2 C-a
bind C-a send-prefix -2
# keyd's `a = A-apostrophe` emits the evdev KEY_APOSTROPHE keycode, which on
# the Norwegian xkb layout is the `æ` key (<AC11>), not `'` (<BKSL>) -- so
# CapsLock+A arrives as Alt+æ. tmux only has two prefix slots, so Alt+æ is
# made a third prefix by switching into the prefix table directly.
bind -N "Prefix (CapsLock+A under a Norwegian layout)" -n M-æ switch-client -T prefix

# -- Terminal / display --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc,*:RGB"
# Lets an app (kitty's own `icat`/graphics protocol, fastfetch's logo, image
# previews, etc.) push raw escape sequences straight to the outer terminal
# via tmux's passthrough DCS wrapping -- without this (tmux default: off),
# any such image data is silently dropped by tmux instead of reaching kitty.
set -g allow-passthrough on
# tmux only emits an OSC 52 clipboard write (see set-clipboard below) if the
# terminfo entry for whatever $TERM it started under advertises the `Ms`
# capability -- outside that, `set-clipboard on` is a silent no-op regardless
# of terminal or tmux version. `*` scopes this to every terminal tmux sees
# (not just xterm-256color above) so it isn't sensitive to kitty vs. an
# SSH'd-in terminal reporting a different outer $TERM.
set -ag terminal-overrides ',*:Ms=\E]52;c;%p2%s\007'
set -sg escape-time 10
set -g focus-events on
set -g mouse on
# OSC 52: every copy into a tmux buffer (`y`, CapsLock+C, mouse drag) is also
# sent to the *attached terminal's* clipboard. That is the one path that works
# with no X display at all -- over SSH or from a TTY-less client, kitty (or any
# OSC 52 terminal) on the far end gets the text. On the local desktop kitty
# writes it to the X CLIPBOARD, where copyq picks it up. CapsLock+X (M-X,
# below) remains the explicit xclip push for terminals without OSC 52.
set -s set-clipboard on
set -g history-limit 10000
set -g renumber-windows on
# Windows/panes stay 0-indexed on purpose: SUPER+[1..9,0] maps to workspace
# [1..10] (key "0" = the 10th slot). tmux's default prefix+[0-9] already
# selects window N, so 0-indexing keeps that mapping literal (prefix+1 ->
# window 1) instead of off-by-one.

# -- Reload config -- matches SUPER+CTRL+R "Reload configuration"; plain `r`
# -- kept as the long-standing short form --
bind -N "Reload tmux config" C-r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# -- New pane -- matches SUPER+RETURN "Open the terminal": on the desktop that
# -- tiles a new terminal into the *current workspace*, i.e. a new tmux pane in
# -- the current window. Split along the longer side (Hyprland dwindle / i3
# -- auto-split behaviour); a terminal cell is ~twice as tall as wide, hence 2x.
bind -N "New pane in cwd (auto split, like SUPER+Return)" Enter if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" \
    'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
# -- New window (a fresh workspace) -- tmux's own `c`, kept in cwd --
bind -N "New window in cwd" c new-window -c "#{pane_current_path}"

# -- Splits, opened in the current pane's working directory --
unbind '"'
unbind %
# both punctuation forms reach the same split -- some keyboard layouts/terminals
# report the bare backslash instead of the shifted `|`, so both are bound rather
# than picking one
bind -N "Split horizontal in cwd" '|' split-window -h -c "#{pane_current_path}"
bind -N "Split horizontal in cwd" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split vertical in cwd" '-' split-window -v -c "#{pane_current_path}"

# -- Focus movement -- matches SUPER + arrows "Move focus [direction]" --
bind -N "Focus pane left"  Left  select-pane -L
bind -N "Focus pane right" Right select-pane -R
bind -N "Focus pane up"    Up    select-pane -U
bind -N "Focus pane down"  Down  select-pane -D
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane right" l select-pane -R
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane down"  j select-pane -D

# -- Seamless pane<->Neovim-split navigation with unprefixed Ctrl-hjkl
# -- (christoomey/vim-tmux-navigator's own documented snippet, used
# -- verbatim -- it correctly passes Ctrl-hjkl through to Neovim when the
# -- focused pane IS Neovim, rather than always intercepting it here, and
# -- restores Ctrl-l as clear-screen via prefix so that isn't lost).
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Focus pane left (passes through to Neovim)"  -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -N "Focus pane down (passes through to Neovim)"  -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -N "Focus pane up (passes through to Neovim)"    -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -N "Focus pane right (passes through to Neovim)" -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -N "Clear screen (Ctrl-l, restored here since the unprefixed C-l above is claimed by vim-tmux-navigator)" C-l send-keys 'C-l'

# -- Resize -- matches SUPER + SHIFT + arrows "Increase/Reduce window width/height"
# -- (repeatable while held, like Hyprland's `repeating = true`) --
bind -N "Resize pane left"  -r S-Left  resize-pane -L 5
bind -N "Resize pane right" -r S-Right resize-pane -R 5
bind -N "Resize pane up"    -r S-Up    resize-pane -U 5
bind -N "Resize pane down"  -r S-Down  resize-pane -D 5

# -- Swap pane -- matches SUPER+ALT+arrows "Swap tiled window [direction]" /
# -- i3's `move [direction]`: swaps with the pane that is actually in that
# -- direction ({left-of} etc.), and focus follows the moved pane. --
bind -N "Swap pane with the one to the left"  -r M-Left  swap-pane -d -t '{left-of}'
bind -N "Swap pane with the one to the right" -r M-Right swap-pane -d -t '{right-of}'
bind -N "Swap pane with the one above"        -r M-Up    swap-pane -d -t '{up-of}'
bind -N "Swap pane with the one below"        -r M-Down  swap-pane -d -t '{down-of}'
# -- Swap split -- loose analog of SUPER+K "Swapsplit": rotate the panes of
# -- the current window one position. --
bind -N "Rotate panes (like SUPER+K swapsplit)" K rotate-window

# -- Kill pane / kill window -- matches SUPER+Q / SUPER+SHIFT+Q
# -- "Kill active window" / "Quit active window" -- with a y/n confirm, like
# -- tmux's own `x`/`&`, since a pane can hold unsaved work. --
bind -N "Kill pane (confirm)" Q confirm-before -p "kill pane #P? (y/n)" kill-pane
bind -N "Kill window (confirm)" X confirm-before -p "kill window #W? (y/n)" kill-window

# -- Zoom pane (fullscreen-ish) -- matches SUPER+F / SUPER+M
# -- "Toggle Fullscreen" / "Toggle Maximize" --
bind -N "Zoom pane" F resize-pane -Z
bind -N "Zoom pane" M resize-pane -Z

# -- Toggle split -- matches SUPER+J "Toggle split" / i3 `layout toggle split`:
# -- panes side by side -> stacked, and back. (Cycling through all five tmux
# -- layouts stays on tmux's own Space, when tmux-thumbs doesn't claim it.) --
bind -N "Toggle split: side-by-side <-> stacked" J if -F "#{e|<:#{pane_width},#{window_width}}" \
    'select-layout even-vertical' 'select-layout even-horizontal'

# -- "Tabbed" -- matches SUPER+G "Toggle window group" / i3 `layout toggle
# -- tabbed split`: a zoomed picker over just this window's panes (the tabs).
# -- `##{` survives run -C's format pass as a literal `#{`, so the filter is
# -- evaluated per tree item against this window's id, fixed at keypress. --
bind -N "Pick a pane of this window (tabbed, like SUPER+G)" G run -C "choose-tree -Z -f '##{==:##{window_id},#{window_id}}'"

# -- Scratchpad -- matches SUPER+S "Toggle scratchpad": a persistent
# -- `scratch` session shown in a popup; the same key inside it hides it. --
bind -N "Toggle scratchpad popup (like SUPER+S)" S if -F "#{==:#{session_name},scratch}" 'detach-client' \
    'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s scratch"'

# -- Select window N -- SUPER+[1..9,0] "Focus workspace N": tmux's own
# -- default prefix+[0-9] already does exactly this, left untouched. --

# -- Move pane to window N -- matches SUPER+SHIFT+[1-9,0] "Move window to
# -- workspace N": the *pane* moves (joins window N, or becomes window N if
# -- there is none yet) and focus follows it. tmux sees Shift+digit as the
# -- symbol the layout sends; on the Norwegian layout that is
# -- ! " # ¤ % & / ( ) = . This shadows tmux defaults on # (list-buffers),
# -- & (kill-window, now X), / (describe-key), ( ) (prev/next session) and
# -- = (choose-buffer, now C-v). --
bind -N "Move pane to window 1" '!'  run-shell '~/.config/tmux/move-pane-to-window.sh 1 "#{pane_id}"'
bind -N "Move pane to window 2" '"'  run-shell '~/.config/tmux/move-pane-to-window.sh 2 "#{pane_id}"'
bind -N "Move pane to window 3" '#'  run-shell '~/.config/tmux/move-pane-to-window.sh 3 "#{pane_id}"'
bind -N "Move pane to window 4" '¤'  run-shell '~/.config/tmux/move-pane-to-window.sh 4 "#{pane_id}"'
bind -N "Move pane to window 5" '%'  run-shell '~/.config/tmux/move-pane-to-window.sh 5 "#{pane_id}"'
bind -N "Move pane to window 6" '&'  run-shell '~/.config/tmux/move-pane-to-window.sh 6 "#{pane_id}"'
bind -N "Move pane to window 7" '/'  run-shell '~/.config/tmux/move-pane-to-window.sh 7 "#{pane_id}"'
bind -N "Move pane to window 8" '('  run-shell '~/.config/tmux/move-pane-to-window.sh 8 "#{pane_id}"'
bind -N "Move pane to window 9" ')'  run-shell '~/.config/tmux/move-pane-to-window.sh 9 "#{pane_id}"'
bind -N "Move pane to window 0" '='  run-shell '~/.config/tmux/move-pane-to-window.sh 0 "#{pane_id}"'

# -- Copy mode -- loose analog of SUPER+V "Open clipboard manager" --
bind -N "Enter copy mode" V copy-mode
# -- Buffer history -- tmux's own clipboard history (what `=` did before
# -- Shift+0 took it above): pick a buffer, Enter pastes it. --
bind -N "Choose a tmux buffer to paste (clipboard history)" C-v choose-buffer -Z
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# `y`, mouse-drag and CapsLock+C copy into tmux's own buffer (and, via
# set-clipboard/OSC 52 above, to the attached terminal's clipboard).
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- Global, unprefixed copy/paste/push via a keyd CapsLock chord:
# -- CapsLock(hold)+C sends Alt+Shift+C (M-C), +V sends Alt+Shift+V (M-V),
# -- +X sends Alt+Shift+X (M-X) -- see /etc/keyd/default.conf's [capslock]
# -- layer. M-C enters copy-mode from the root table (no prefix needed),
# -- then a second M-C finishes the pending selection into tmux's buffer
# -- (same as `y`). M-V pulls the X CLIPBOARD into tmux and pastes it (same
# -- as the prefix+v fallback below); with no X display reachable (SSH/TTY)
# -- it just pastes tmux's newest buffer. M-X is the explicit "push tmux's
# -- current buffer to the X clipboard" action via xclip.
bind -N "Enter copy mode (CapsLock+C)" -n M-C copy-mode
bind -T copy-mode-vi M-C send -X copy-selection-and-cancel
bind -T copy-mode    M-C send -X copy-selection-and-cancel
bind -N "Paste from system clipboard (CapsLock+V)" -n M-V run-shell "xclip -selection clipboard -o 2>/dev/null | tmux load-buffer - 2>/dev/null; true" \; paste-buffer -p
# setsid -f: xclip forks a child that must keep serving the selection after
# this job ends -- detached into its own session so tmux's job cleanup can't
# take it down (the same failure wl-copy had on the Wayland side), and with
# stdout/stderr closed so run-shell doesn't wait on the child's fds.
bind -N "Push tmux buffer to system clipboard (CapsLock+X)" -n M-X run-shell "tmux save-buffer - | setsid -f xclip -selection clipboard -i >/dev/null 2>&1"

# -- Mouse drag-select-and-release copies to tmux's buffer (same as `y`).
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-and-cancel

# -- System clipboard paste: kitty's own unprefixed Ctrl+Shift+V is the
# -- every-day path (it injects the clipboard as a bracketed paste before
# -- tmux sees the key). Fallback for non-kitty/SSH'd-in clients: pull the X
# -- CLIPBOARD into a tmux buffer first, then paste it, so anything reading
# -- tmux's buffers (C-v) sees GUI-copied content too. `-p` keeps
# -- bracketed-paste.
bind -N "Paste from system clipboard (fallback for non-kitty clients)" v run-shell "xclip -selection clipboard -o 2>/dev/null | tmux load-buffer - 2>/dev/null; true" \; paste-buffer -p
# tmux's default update-environment already carries DISPLAY and XAUTHORITY
# from the attaching client (and drops them when attaching over SSH without
# X forwarding, which is what makes xclip fail cleanly there).

# Jobs (run-shell, copy-pipe, tmux-thumbs' --command) inherit the server's
# global environment merged with the session's. A server that outlives an X
# session restart (kept alive by tmux-continuum) keeps a stale global
# DISPLAY/XAUTHORITY/DBUS_SESSION_BUS_ADDRESS -- refresh-clipboard-env.sh
# re-reads them from systemd --user (which Debian's Xsession.d pushes on every
# X login). client-attached is the moment that matters; pane-focus-in is a
# cheap second trigger; also run once at config-load time.
set-hook -g client-attached "run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'"
set-hook -g pane-focus-in "run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'"
run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'

# -- Keybind reference/help -- matches SUPER+CTRL+K "Show keybindings" --
# -- a popup explaining the SUPER-mirroring logic plus the live prefix/root
# -- bind tables, for training muscle memory on this scheme. --
bind -N "Show keybindings + the logic behind them" C-k display-popup -h 80% -w 70% -E "~/.config/tmux/keybindings-help.sh"

# -- sesh: zoxide-integrated session picker, replacing tmux's own default
# -- choose-session on `s`. sesh is a standalone Go binary not packaged in
# -- Debian -- falls back to tmux's own session tree when it's missing. --
bind -N "Session picker (sesh, else choose-tree)" s if-shell "command -v sesh >/dev/null" \
    'display-popup -h 90% -w 75% -E "sesh picker -i"' 'choose-tree -Zs'

# -- Window overview -- matches SUPER+Tab "Open Select Window Menu" -- a
# -- zoomed preview tree of every window to jump from. --
bind -N "Window overview" Tab choose-tree -Zw

# -- Sync panes -- tmux-only concept, no desktop equivalent: broadcast
# -- keystrokes to every pane in the window at once. The status-left SYNC
# -- indicator below is the persistent version of this same state. --
bind -N "Toggle sync-panes" e setw synchronize-panes \; display-message "sync-panes #{?synchronize-panes,on,off}"

# -- lazygit / btop popups -- tmux-only, no desktop equivalent: opened
# -- centered over the current pane's cwd, when installed. --
bind -N "lazygit (cwd)" g if-shell "command -v lazygit >/dev/null" \
    'display-popup -E -w 90% -h 90% -T " lazygit " -d "#{pane_current_path}" lazygit' \
    'display-message "lazygit is not installed"'
bind -N "btop" b if-shell "command -v btop >/dev/null" \
    'display-popup -E -w 90% -h 90% -T " btop " -d "#{pane_current_path}" btop' \
    'display-message "btop is not installed"'

# -- Pane titles -- tmux-only. Shows each pane's running command in a top
# -- border line; manual toggle (explicit over inferred state).
set -g pane-border-status off
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
set -g pane-border-lines heavy
bind -N "Toggle pane titles" T set -w pane-border-status

# -- Status bar -- colors come from @thm_* user options, live-updated by
# -- matugen on every wallpaper change (~/.config/tmux/colors-matugen.conf).
# -- Fallback defaults set first so the format strings below still resolve
# -- to something sane before matugen has ever run once.
set -gq @thm_bg "#0d0d0d"
set -gq @thm_fg "#00ff00"
set -gq @thm_primary "#00ff00"
set -gq @thm_on_primary "#0d0d0d"
set -gq @thm_surface "#0d0d0d"
set -gq @thm_surface_variant "#444444"
set -gq @thm_outline "#444444"
source-file -q ~/.config/tmux/colors-matugen.conf

# -- Colour-family options -- these don't expand #{...} formats the way style
# -- strings do (unlike status-style etc. below), so they need the -F
# -- (expand-once) form, and must sit after colors-matugen.conf is sourced
# -- above so they still refresh on matugen's post-hook re-source. --
set -gF display-panes-colour        "#{@thm_surface_variant}"
set -gF display-panes-active-colour "#{@thm_primary}"
set -gF clock-mode-colour           "#{@thm_primary}"

# -- Copy-mode selection, message/command line, and display-popup styling --
# -- all themed to match, instead of tmux's black/white defaults. --
set -g mode-style             "bg=#{@thm_primary},fg=#{@thm_on_primary}"
set -g message-style          "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style  "bg=#{@thm_surface},fg=#{@thm_primary}"
set -g popup-style            "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g popup-border-style     "fg=#{@thm_primary}"

# Stops shell escape sequences from silently overwriting a manually-set
# window name (e.g. after `prefix+,` renaming a window by hand).
set -g allow-rename off

# 10, not 15: tmux-sensible only overrides status-interval while it still
# sits at tmux's factory default of 15, so 15 here would be clobbered back
# to 5. status-right.sh is one cheap /proc + /sys read per tick.
set -g status-interval 10
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left "#{@thm_nested_marker}#{?client_prefix,#[reverse] PFX #[noreverse],} #S #{?pane_synchronized,#[fg=#{@thm_primary}]SYNC#[default] ,}"
set -g status-left-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g status-right "#[fg=#{@thm_outline}]#{b:pane_current_path} #[fg=#{@thm_fg}]| #(~/.config/tmux/status-right.sh) #[fg=#{@thm_primary}]%H:%M "
set -g window-status-current-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,*,} "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#{@thm_primary}"
set -g pane-border-style "fg=#{@thm_surface_variant}"

# -- Nested-session marker -- no reliable automatic way to detect "this tmux
# -- runs inside another tmux" from config alone. Manual toggle instead, for
# -- after SSHing into a host that's also running tmux: prefix+N marks it,
# -- prefix+CTRL+N clears it.
set -g @thm_nested_marker ""
bind -N "Mark session as nested" N set -g @thm_nested_marker "[NESTED]"
bind -N "Clear nested marker" C-n set -g @thm_nested_marker ""

# -- Plugins (TPM) -- optional. Bootstrap once: git clone
# -- https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, then prefix + I
# -- inside a session to fetch/install the plugins below. Nothing here
# -- depends on them; without TPM this block is inert. --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-thumbs: vimium/easymotion-style hint-jump to any visible string
# (URL, path, hash, IP...) for one-key copy or open, no mouse drag needed.
# Bound on Space (tmux default: next-layout). Needs cargo to build.
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key space
set -g @thumbs-command 'echo -n {} | setsid -f xclip -selection clipboard -i >/dev/null 2>&1'
set -g @thumbs-upcase-command 'xdg-open {}'

# tmux-continuum: auto-save every 15 min via tmux-resurrect, auto-restore
# the last saved session when tmux itself (re)starts (e.g. after a reboot).
set -g @continuum-restore 'on'
# tmux-resurrect: also capture each pane's visible scrollback, not just
# which command was running in it.
set -g @resurrect-capture-pane-contents 'on'
# resurrect's default restore key is prefix+C-r, which is the reload key
# here (SUPER+CTRL+R) -- restore moves to prefix+R; save stays on prefix+C-s.
set -g @resurrect-restore-key 'R'

if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run -b '~/.tmux/plugins/tpm/tpm'"
