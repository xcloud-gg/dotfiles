# ~/.tmux.conf — mirrors this machine's Hyprland keybind scheme (mainMod = SUPER)
# wherever tmux has a comparable concept. tmux's "prefix" stands in for SUPER, since
# terminals can't reliably capture Super-key combos.
#
# Source Hyprland config read for this mapping:
#   ~/.config/hypr/conf/keybindings/default.lua

# -- Prefix: Alt+' -- single comfortable keypress, also reachable via a
# -- CapsLock(hold)+A keyd chord (/etc/keyd/default.conf's [capslock]
# -- layer). Ctrl+Space (this config's previous prefix) demoted; Ctrl-a
# -- (before that) kept as the long-standing fallback for muscle memory. --
unbind C-b
set -g prefix M-\'
bind M-\' send-prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# -- Terminal / display --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc,*:RGB"
# Lets an app (kitty's own `icat`/graphics protocol, fastfetch's logo, image
# previews, etc.) push raw escape sequences straight to the outer terminal
# via tmux's passthrough DCS wrapping -- without this (tmux default: off),
# any such image data is silently dropped by tmux instead of reaching kitty.
# Needs tmux >=3.3 (this machine: 3.7c). Not sufficient on its own to prove
# images render -- that needs a real attached client to verify, not a
# background/detached server (see CHANGELOG.md 2026-09-18).
set -g allow-passthrough on
# tmux only emits an OSC 52 clipboard write (see set-clipboard below) if the
# terminfo entry for whatever $TERM it started under advertises the `Ms`
# capability -- outside that, `set-clipboard on` is a silent no-op regardless
# of terminal or tmux version. `*` scopes this to every terminal tmux sees
# (not just xterm-256color above) so it isn't sensitive to kitty vs. an
# SSH'd-in terminal reporting a different outer $TERM.
set -ag terminal-overrides ',*:Ms=\E]52;c;%p2%s\007'
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -s set-clipboard off  # explicit-push-only by design -- CapsLock+X/`v`/CapsLock+V are the only paths to the host clipboard (see the copy-mode binds below); kitty's native Ctrl+Shift+C-after-drag no longer has anything to pick up as a result -- accepted trade-off, not a bug
set -g history-limit 10000
set -g renumber-windows on
# Windows/panes stay 0-indexed on purpose: Hyprland's SUPER+[1..9,0] maps to
# workspace [1..10] (key "0" = the 10th slot, see the modulo trick in
# keybindings/default.lua). tmux's default prefix+[0-9] already selects window N,
# so 0-indexing is what keeps that mapping literal instead of off-by-one.

# -- Reload config -- matches SUPER+CTRL+R "Reload Hyprland configuration" --
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# -- New window (a fresh terminal) -- matches SUPER+RETURN "Open the terminal" --
bind -N "New window in cwd" c new-window -c "#{pane_current_path}"
bind -N "New window in cwd" Enter new-window -c "#{pane_current_path}"

# -- Splits, opened in the current pane's working directory --
unbind '"'
unbind %
# both punctuation forms reach the same split -- some keyboard layouts/terminals
# report the bare backslash instead of the shifted `|`, so both are bound rather
# than picking one
bind -N "Split horizontal in cwd" '|' split-window -h -c "#{pane_current_path}"
bind -N "Split horizontal in cwd" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split vertical in cwd" '-' split-window -v -c "#{pane_current_path}"

# -- Focus movement -- matches SUPER + arrows "Move focus [direction]" --
bind -N "Focus pane left"  Left  select-pane -L
bind -N "Focus pane right" Right select-pane -R
bind -N "Focus pane up"    Up    select-pane -U
bind -N "Focus pane down"  Down  select-pane -D
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane right" l select-pane -R
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane down"  j select-pane -D

# -- Seamless pane<->Neovim-split navigation with unprefixed Ctrl-hjkl
# -- (christoomey/vim-tmux-navigator's own documented snippet, used
# -- verbatim -- it correctly passes Ctrl-hjkl through to Neovim when the
# -- focused pane IS Neovim, rather than always intercepting it here, and
# -- restores Ctrl-l as clear-screen via prefix so that isn't lost). The
# -- nvim side removes its own <C-hjkl> window-nav maps in favor of this
# -- plugin's equivalent (dotfiles/nvim/.config/nvim/lua/config/keymaps.lua).
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Focus pane left (passes through to Neovim)"  -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -N "Focus pane down (passes through to Neovim)"  -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -N "Focus pane up (passes through to Neovim)"    -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -N "Focus pane right (passes through to Neovim)" -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -N "Clear screen (Ctrl-l, restored here since the unprefixed C-l above is claimed by vim-tmux-navigator)" C-l send-keys 'C-l'

# -- Resize -- matches SUPER + SHIFT + arrows "Increase/Reduce window width/height"
# -- (repeatable while held, like Hyprland's `repeating = true`) --
bind -N "Resize pane left"  -r S-Left  resize-pane -L 5
bind -N "Resize pane right" -r S-Right resize-pane -R 5
bind -N "Resize pane up"    -r S-Up    resize-pane -U 5
bind -N "Resize pane down"  -r S-Down  resize-pane -D 5

# -- Swap pane position -- loose analog of SUPER+ALT+arrows "Swap tiled window
# [direction]". tmux panes are ordered, not on a 2D grid like Hyprland's, so all
# four directions resolve to swap-with-previous/next in tile order. --
bind -N "Swap pane earlier" -r M-Up    swap-pane -U
bind -N "Swap pane earlier" -r M-Left  swap-pane -U
bind -N "Swap pane later"   -r M-Down  swap-pane -D
bind -N "Swap pane later"   -r M-Right swap-pane -D

# -- Kill pane / kill window -- matches SUPER+Q / SUPER+SHIFT+Q
# -- "Kill active window" / "Quit active window" --
bind -N "Kill pane" Q kill-pane
bind -N "Kill window" X kill-window

# -- Zoom pane (fullscreen-ish) -- matches SUPER+F / SUPER+M
# -- "Toggle Fullscreen" / "Toggle Maximize" --
bind -N "Zoom pane" F resize-pane -Z
bind -N "Zoom pane" M resize-pane -Z

# -- Cycle layout -- loose analog of SUPER+J "Toggle split" --
bind -N "Cycle layout" J next-layout

# -- Move current window to slot N -- matches SUPER+SHIFT+[1-9,0]
# -- "Move window to workspace N" (tmux sees Shift+digit as the punctuation the
# -- keyboard actually sends: Shift+1 = "!", Shift+2 = "@", etc.) --
bind -N "Move window to slot 1" '!' move-window -t 1
bind -N "Move window to slot 2" '@' move-window -t 2
bind -N "Move window to slot 3" '#' move-window -t 3
bind -N "Move window to slot 4" '$' move-window -t 4
bind -N "Move window to slot 5" '%' move-window -t 5
bind -N "Move window to slot 6" '^' move-window -t 6
bind -N "Move window to slot 7" '&' move-window -t 7
bind -N "Move window to slot 8" '*' move-window -t 8
bind -N "Move window to slot 9" '(' move-window -t 9
bind -N "Move window to slot 0" ')' move-window -t 0

# -- Copy mode -- loose analog of SUPER+V "Open clipboard manager" --
bind -N "Enter copy mode" V copy-mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# `y`, mouse-drag, and CapsLock+C (below) are deliberately *tmux-internal
# only* -- they used to also copy-pipe straight to wl-copy, but that made
# every single one of them silently depend on reaching the live Wayland
# compositor at that exact instant (a stale WAYLAND_DISPLAY in an old
# pane, tmux's job-control killing wl-copy before it could detach, etc.)
# -- a failure with zero visible signal, discovered only later when
# pasting into the host came up empty. Pushing to the host clipboard is
# now a separate, explicit action: CapsLock+X (M-X, below).
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- Global, unprefixed copy/paste/push via a keyd CapsLock chord:
# -- CapsLock(hold)+C sends Alt+Shift+C (M-C), +V sends Alt+Shift+V (M-V),
# -- +X sends Alt+Shift+X (M-X) -- see /etc/keyd/default.conf's [capslock]
# -- layer. M-C enters copy-mode from the root table (no prefix needed),
# -- then a second M-C finishes the pending selection into tmux's *own*
# -- buffer only (same as `y`) -- nothing here touches the system
# -- clipboard. M-V pulls from the live Wayland clipboard into tmux (same
# -- command as the prefix+v fallback below). M-X is the explicit
# -- "push tmux's current buffer to the host clipboard" action -- whatever
# -- was last yanked by any means (M-C, `y`, a mouse drag), on demand,
# -- right when you press it, instead of automatically and invisibly.
bind -N "Enter copy mode (CapsLock+C)" -n M-C copy-mode
bind -T copy-mode-vi M-C send -X copy-selection-and-cancel
bind -T copy-mode    M-C send -X copy-selection-and-cancel
bind -N "Paste from system clipboard (CapsLock+V)" -n M-V run-shell "wl-paste -n 2>/dev/null | tmux load-buffer -" \; paste-buffer -p
bind -N "Push tmux buffer to system clipboard (CapsLock+X)" -n M-X run-shell "tmux save-buffer - | wl-copy"

# -- Mouse drag-select-and-release copies to tmux's own buffer only (same
# -- tmux-internal-only reasoning as `y`/M-C above) -- press CapsLock+X
# -- afterward to push it to the host clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-and-cancel

# -- System clipboard paste: use kitty's own unprefixed Ctrl+Shift+V. It
# -- intercepts the keypress before tmux ever sees it and injects the
# -- clipboard straight into the pane as a bracketed paste, so it bypasses
# -- tmux's prefix table and internal buffers entirely -- no chord, no
# -- keyboard-layout dependence (this used to be `prefix+]`, which is
# -- Ctrl+Space then AltGr+9 on a Norwegian layout -- genuinely bad).
# -- This is the every-day path; the fallback bind below is only for
# -- clients where that native passthrough isn't available.
#
# -- Fallback for non-kitty/SSH'd-in clients: tmux's own default `]`
# -- (paste-buffer) only ever replays tmux's *internal* buffers, so
# -- anything copied outside tmux (a browser, any GUI app) never reaches it
# -- without this. Pulls the live Wayland clipboard into a tmux buffer
# -- first, then pastes it, so anything reading tmux's paste buffer (e.g.
# -- choosing a buffer via prefix+=) sees GUI-copied content too. `-p` keeps
# -- bracketed-paste.
bind -N "Paste from system clipboard (fallback for non-kitty clients)" v run-shell "wl-paste -n 2>/dev/null | tmux load-buffer -" \; paste-buffer -p
# tmux's default update-environment list carries $DISPLAY but not
# $WAYLAND_DISPLAY, so a pane opened after a compositor restart (tmux itself
# kept alive by tmux-continuum) could otherwise inherit a stale/missing
# value and silently break the wl-copy/wl-paste calls above.
set -ga update-environment WAYLAND_DISPLAY

# The above only pushes WAYLAND_DISPLAY into a *session*, not into what
# jobs actually inherit -- copy-pipe/run-shell/tmux-thumbs' --command all
# inherit the SERVER's environment, not the pane's or client's, and tmux
# never refreshes that on its own. A server that outlives a compositor
# restart (tmux itself kept alive by tmux-continuum) keeps stale
# WAYLAND_DISPLAY/XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS forever, and
# every clipboard/link-opening path above starts silently no-op'ing with
# zero visible signal -- see refresh-clipboard-env.sh for the full story.
# client-attached fires exactly at the moment that matters (reattaching
# after being away, e.g. after a restart) and was verified to fire
# reliably (pane-focus-in, tried first, did not fire reliably in testing
# despite `focus-events on` -- kept as a defensive second trigger anyway,
# since it costs nothing if it happens not to fire). Also run once at
# config-load time so `prefix+r`/a fresh server start pick up a correct
# value immediately rather than waiting for the next attach.
set-hook -g client-attached "run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'"
set-hook -g pane-focus-in "run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'"
run-shell -b '~/.config/tmux/refresh-clipboard-env.sh'

# -- Keybind reference/help -- matches SUPER+CTRL+K "Show keybindings"
# -- (~/.config/hypr/scripts/keybindings.sh's rofi cheat-sheet) -- a small
# -- popup explaining the SUPER-mirroring logic plus the live prefix/root
# -- bind tables, for training muscle memory on this scheme. --
bind -N "Show keybindings + the logic behind them" C-k display-popup -h 70% -w 60% -E "~/.config/tmux/keybindings-help.sh"

# -- sesh: zoxide-integrated session picker (already have zoxide wired into
# -- the shells), replacing tmux's own default choose-session on `s` with
# -- something smarter rather than adding a new key. Requires `sesh` on
# -- PATH (not a tmux plugin -- a standalone Go binary). --
bind -N "sesh session picker" s display-popup -h 90% -w 75% -E "sesh picker -i"

# -- Window overview -- matches SUPER+Tab "Open Select Window Menu" (the
# -- quickshell overview) -- a zoomed preview tree of every window to jump
# -- from, tmux's own closest equivalent. --
bind -N "Window overview" Tab choose-tree -Zw

# -- Sync panes -- no Hyprland equivalent (there's nothing to mirror; this is
# -- a tmux-only concept), but common enough to be worth a key: broadcast
# -- keystrokes to every pane in the window at once, e.g. running the same
# -- command against several hosts side by side. The status-left SYNC
# -- indicator below is the persistent version of this same state. --
bind -N "Toggle sync-panes" e setw synchronize-panes \; display-message "sync-panes #{?synchronize-panes,on,off}"

# -- lazygit / btop popups -- tmux-only, no Hyprland equivalent (same class
# -- as `e` above): quick access to two tools already installed on this
# -- machine, opened centered over the current pane's cwd. --
bind -N "lazygit (cwd)" g display-popup -E -w 90% -h 90% -T " lazygit " -d "#{pane_current_path}" lazygit
bind -N "btop" b display-popup -E -w 90% -h 90% -T " btop " -d "#{pane_current_path}" btop

# -- Pane titles -- tmux-only, no Hyprland equivalent. Shows each pane's
# -- running command in a top border line; manual toggle (not an automatic
# -- show/hide hook) per this repo's established preference for explicit
# -- over inferred state (see the @thm_nested_marker N/C-n precedent below).
set -g pane-border-status off
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
set -g pane-border-lines heavy
bind -N "Toggle pane titles" T set -w pane-border-status

# -- Status bar -- colors come from @thm_* user options, live-updated by
# -- matugen on every wallpaper change (dotfiles/matugen/.config/matugen/
# -- templates/tmux-colors.conf -> ~/.config/tmux/colors-matugen.conf),
# -- same pattern kitty/waybar/rofi/gtk already use. Fallback defaults set
# -- first so the format strings below still resolve to something sane on
# -- a fresh install, before matugen has ever run once.
set -gq @thm_bg "#0d0d0d"
set -gq @thm_fg "#00ff00"
set -gq @thm_primary "#00ff00"
set -gq @thm_on_primary "#0d0d0d"
set -gq @thm_surface "#0d0d0d"
set -gq @thm_surface_variant "#444444"
set -gq @thm_outline "#444444"
source-file -q ~/.config/tmux/colors-matugen.conf

# -- Colour-family options -- these don't expand #{...} formats the way style
# -- strings do (unlike status-style etc. below), so they need the -F
# -- (expand-once) form, and must sit after colors-matugen.conf is sourced
# -- above so they still refresh on matugen's post-hook re-source. --
set -gF display-panes-colour        "#{@thm_surface_variant}"
set -gF display-panes-active-colour "#{@thm_primary}"
set -gF clock-mode-colour           "#{@thm_primary}"

# -- Copy-mode selection, message/command line, and display-popup styling --
# -- all themed to match, instead of tmux's black/white defaults. --
set -g mode-style             "bg=#{@thm_primary},fg=#{@thm_on_primary}"
set -g message-style          "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style  "bg=#{@thm_surface},fg=#{@thm_primary}"
set -g popup-style            "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g popup-border-style     "fg=#{@thm_primary}"

# Stops shell escape sequences from silently overwriting a manually-set
# window name (e.g. after `prefix+,` renaming a window by hand).
set -g allow-rename off

# status-interval bounds how often the #() shell-out below actually re-runs
# -- tmux caches the result and only re-invokes the command on each
# interval tick, not on every render. Deliberately NOT set to 15 here:
# tmux-sensible (loaded below via TPM) only overrides status-interval when it
# sees the value still sitting at tmux's own factory default of 15 -- setting
# it to that same number here is therefore indistinguishable from never
# having set it at all, and tmux-sensible silently clobbers it back to 5
# (verified live: this bit us on the first real reload). 10 is a value
# tmux-sensible's own "has the user changed this" check actually recognizes
# as customized. ~/.config/tmux/status-right.sh does one combined /proc +
# /sys read (no `top`/`ps` subprocess spawn, measured <15ms by hand) rather
# than several separate #() calls -- deliberately avoiding the classic tmux
# performance pitfall of an expensive per-render status segment (e.g. a
# naive git-branch script), which this isn't, so 10s vs. tmux-sensible's 5s
# default is a non-issue either way -- this is about the value actually
# sticking, not performance.
set -g status-interval 10
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left "#{@thm_nested_marker}#{?client_prefix,#[reverse] PFX #[noreverse],} #S #{?pane_synchronized,#[fg=#{@thm_primary}]SYNC#[default] ,}"
set -g status-left-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g status-right "#[fg=#{@thm_outline}]#{b:pane_current_path} #[fg=#{@thm_fg}]| #(~/.config/tmux/status-right.sh) #[fg=#{@thm_primary}]%H:%M "
set -g window-status-current-style "bg=#{@thm_primary},fg=#{@thm_on_primary},bold"
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,*,} "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#{@thm_primary}"
set -g pane-border-style "fg=#{@thm_surface_variant}"

# -- Nested-session marker -- there's no reliable *automatic* way to detect
# -- "this tmux is itself running inside another tmux" from config alone:
# -- tmux always sets $TMUX freshly for its own panes, so checking its
# -- value from inside never actually reveals an outer session (verified by
# -- hand: nesting one tmux inside another and inspecting $TMUX at each
# -- level shows two independently-valid values, not a stacked one).
# -- Manual toggle instead, for after SSHing into a host that's also
# -- running tmux -- press prefix+N there to mark it, prefix+CTRL+N to
# -- clear it, so it's easy to tell which machine's session a keystroke is
# -- actually going to.
set -g @thm_nested_marker ""
bind -N "Mark session as nested" N set -g @thm_nested_marker "[NESTED]"
bind -N "Clear nested marker" C-n set -g @thm_nested_marker ""

# -- Plugins (TPM) -- bootstrap once: git clone
# -- https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, then
# -- prefix + I inside a session to fetch/install the plugins below. --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-thumbs: vimium/easymotion-style hint-jump to any visible string
# (URL, path, hash, IP...) for one-key copy or open, no mouse drag needed.
# Bound on Space, which vanilla tmux defaults to next-layout -- already
# fully duplicated by this config's own `J` bind above, so this retires a
# dead duplicate rather than claiming a key in active use.
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key space
set -g @thumbs-command 'echo -n {} | setsid -f wl-copy'
set -g @thumbs-upcase-command 'xdg-open {}'

# tmux-continuum: auto-save every 15 min via tmux-resurrect, auto-restore
# the last saved session when tmux itself (re)starts (e.g. after a reboot).
set -g @continuum-restore 'on'
# tmux-resurrect: also capture each pane's visible scrollback, not just
# which command was running in it.
set -g @resurrect-capture-pane-contents 'on'

run -b '~/.tmux/plugins/tpm/tpm'
